name: scale-report

on:
  push:
    branches: ["**"]
    tags: ["v*"]

defaults:
  run:
    working-directory: scale-report

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scale-report
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  release:
    name: release x86_64-linux (musl)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Package
        run: |
          cp target/x86_64-unknown-linux-musl/release/scale-report scale-report-x86_64-linux
          ./scale-report-x86_64-linux --version
      - uses: softprops/action-gh-release@v2
        with:
          files: scale-report/scale-report-x86_64-linux
          fail_on_unmatched_files: true
